[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ABSim"
version = "0.1.0"
description = "Interactive 2-D simulations of collective animal movement with individual variation"
authors = [{name = "Jolle Jolles", email = "j.w.jolles@gmail.com"}]
maintainers = [{name = "Jolle Jolles", email = "j.w.jolles@gmail.com"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
notebook = ["jupyter", "matplotlib", "pandas"]
masks = ["Pillow"]

[project.urls]
Homepage = "https://github.com/jollejolles/ABSim"
Repository = "https://github.com/jollejolles/ABSim"

[tool.setuptools.packages.find]
# Flat layout: find ABSim/ (and its sub-packages) in the project root.
# Explicitly include only the package so the venv, temp files, etc. are ignored.
include = ["ABSim*"]

# Tkinter is only required by the interactive GUI and is installed with Python.
